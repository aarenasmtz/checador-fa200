server {
    listen 80;
    server_name _;

    # Client application build (SPA React 19)
    location / {
        root /var/www/attendance-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API .NET 9 Reverse Proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger Documentation
    location /swagger {
        proxy_pass         http://127.0.0.1:5081/swagger;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Health check
    location /health {
        proxy_pass         http://127.0.0.1:5081/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
