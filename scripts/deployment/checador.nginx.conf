# ==============================================================================
# Nginx Configuration - Sistema Checador (Producción)
# Subdominios: checador.wpcbajio.com & api-checador.wpcbajio.com
# ==============================================================================

# 1. Backend API (.NET 9 Kestrel en puerto 5081)
server {
    listen 80;
    server_name api-checador.wpcbajio.com;
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# 2. Frontend Web (SPA React 19 en /var/www/checador-web)
server {
    listen 80;
    server_name checador.wpcbajio.com;
    client_max_body_size 20M;

    root /var/www/checador-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy local directo para llamadas relativas /api/
    location /api/ {
        proxy_pass         http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
