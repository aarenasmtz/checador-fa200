<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner subtle border for premium depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Clock Outer Ring -->
  <circle cx="28" cy="28" r="18" fill="#1e1b4b" fill-opacity="0.35" stroke="url(#clockGrad)" stroke-width="3" />

  <!-- Clock Hour Ticks -->
  <circle cx="28" cy="14" r="1.5" fill="#ffffff" />
  <circle cx="42" cy="28" r="1.5" fill="#ffffff" />
  <circle cx="28" cy="42" r="1.5" fill="#ffffff" />
  <circle cx="14" cy="28" r="1.5" fill="#ffffff" />

  <!-- Clock Hands (Checada Punctual: Hour at 8, Minute at 12) -->
  <line x1="28" y1="28" x2="28" y2="16" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
  <line x1="28" y1="28" x2="18.5" y2="34.5" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="28" cy="28" r="2.8" fill="#ffffff" />

  <!-- Verified Checada Checkmark Badge (Bottom-Right) -->
  <g filter="url(#shadow)">
    <circle cx="46" cy="46" r="13.5" fill="#ffffff" />
    <circle cx="46" cy="46" r="11" fill="url(#checkGrad)" />
    <!-- White Checkmark -->
    <path d="M40.5 46.5 L44.5 50.5 L51.5 42" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>